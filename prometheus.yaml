# Prometheus Configuration
# MCP-First, J-Lens Anchored Agentic Harness

model:
  model_id: "gpt2"
  device: "cpu"
  dtype: "float32"
  load_in_4bit: false
  load_in_8bit: false
  trust_remote_code: false

jlens:
  n_samples: 512
  batch_size: 8
  workspace_band: [0.33, 0.67]
  top_k_default: 10
  decompose_k: 25
  enable_steering: false
  cache_dir: ".prometheus/cache"

watchlist:
  categories:
    deception:
      threshold: 0.15
      tokens: ["fake", "secretly", "lie", "pretend", "deceive", "mislead", "fabricate"]
    prompt_injection:
      threshold: 0.10
      tokens: ["ignore", "override", "system", "inject", "bypass", "disregard"]
    eval_awareness:
      threshold: 0.12
      tokens: ["benchmark", "test", "evaluate", "score", "assessment", "exam"]
    self_preservation:
      threshold: 0.15
      tokens: ["survive", "shutdown", "delete", "replace", "terminate", "disable"]
    reward_hacking:
      threshold: 0.12
      tokens: ["hack", "exploit", "cheat", "shortcut", "game", "manipulate"]

authz:
  default_mode: "deny_by_default"
  max_tool_calls: 100
  max_writes: 20
  max_external_calls: 10
  max_irreversible: 3
  require_human_for_irreversible: true

observability:
  otel_endpoint: null
  langfuse_public_key: null
  langfuse_secret_key: null
  langfuse_host: "https://cloud.langfuse.com"
  log_level: "INFO"
  json_logs: true

cloudflare:
  worker_name: "prometheus-mcp"
  upstream_url: null
  ai_binding: false
  account_id: null
  api_token: null

memory:
  vault_path: ".prometheus/vault"
  core_blocks:
    persona: 1500
    user: 1500
    system: 1000
    project: 2000
    scratch: 1000
