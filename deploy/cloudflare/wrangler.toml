name = "prometheus-mcp"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Durable Objects for session state (SQLite-backed per Cloudflare requirement)
[[durable_objects.bindings]]
name = "SESSION_STATE"
class_name = "SessionState"

# KV for lens storage
[[kv_namespaces]]
binding = "LENS_STORE"
id = "e6b16cba2576427a9fb7d5f51bb2c2fb"

# R2 for large model artifacts
[[r2_buckets]]
binding = "MODEL_ARTIFACTS"
bucket_name = "prometheus-artifacts"

# Secrets (set via `wrangler secret put`)
# OPENAI_API_KEY
# PROMETHEUS_AUTH_TOKEN

[build]
command = "npm run build"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionState"]

# Custom domain route
[[routes]]
pattern = "prometheus.e5enclave.com/mcp*"
zone_name = "e5enclave.com"
