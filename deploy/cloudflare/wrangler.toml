name = "prometheus-mcp"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Durable Objects for session state
[[durable_objects.bindings]]
name = "SESSION_STATE"
class_name = "SessionState"

# KV for lens storage
[[kv_namespaces]]
binding = "LENS_STORE"
id = "placeholder_id"

# R2 for large model artifacts
[[r2_buckets]]
binding = "MODEL_ARTIFACTS"
bucket_name = "prometheus-artifacts"

# Secrets (set via `wrangler secret put`)
# OPENAI_API_KEY
# PROMETHEUS_AUTH_TOKEN

[build]
command = "npm run build"

[[migrations]]
tag = "v1"
new_classes = ["SessionState"]
